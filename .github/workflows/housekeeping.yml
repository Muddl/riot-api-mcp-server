name: Weekly Housekeeping

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:        # manual runs always proceed (bypass the commit gate)

# Never let two housekeeping runs race on the same branch (e.g. a manual dispatch during a
# scheduled run, or two scheduled runs in one week). Queue rather than cancel — a half-finished
# maintenance pass shouldn't be killed mid-edit.
concurrency:
  group: weekly-housekeeping
  cancel-in-progress: false

# Least-privilege; elevate only where needed.
permissions:
  contents: read

jobs:
  housekeeping:
    # Kill switch. This is the only unattended cron in the factory, so it is the job the switch
    # exists for. Absent/mistyped variable means OFF. Gating the job (not the step) also skips
    # the git/PR steps, so a disabled factory opens no branches.
    if: vars.FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # claude-code-action exposes no timeout of its own; its message loop runs until the job's.
    # This job runs unattended on a Monday cron — an unbounded hang is the worst case.
    timeout-minutes: 30
    permissions:
      contents: write        # create the housekeeping branch
      pull-requests: write   # open the PR
      issues: write          # post the @Muddl failure alert (see the last step)
      id-token: write
    steps:
      - name: Checkout (full history for the commit gate)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gate: on a scheduled run, proceed only if commits landed in the last week.
      # Manual (workflow_dispatch) runs always proceed.
      - name: Commit gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          COUNT="$(git rev-list --count --since='1 week ago' HEAD)"
          if [ "$COUNT" -gt 0 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Housekeeping::$COUNT commit(s) in the last week — running."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Housekeeping skipped::No commits in the last week."
          fi

      - name: Run housekeeping skill (apply mode, edits only)
        if: steps.gate.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Run the housekeeping skill to audit and fix drift in this repo's docs, knowledge base,
            roadmap, skills, and agents. Apply the fixes to the working tree. Do NOT commit, push,
            or open a pull request — a later workflow step owns all git operations. Never edit
            anything under docs/superpowers/specs/ or docs/superpowers/plans/ (immutable history).
          claude_args: |
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(grep:*),Bash(ls:*),Bash(comm:*),Bash(sort:*),Bash(wc:*),Bash(sed:*),Bash(xargs:*),Bash(basename:*),Bash(git status:*),Bash(git diff:*)"

      # Mint a 1-hour installation token for the MuddlBot GitHub App, immediately before the only
      # step that uses it — the action revokes it again in its own post-step, so the credential's
      # live window is minutes rather than the 90 days of the PAT it replaces (ADR-0020).
      #
      # Omitting `owner` and `repositories` scopes the token to the current repository, which is
      # also the only repository the App is installed on. Placed AFTER the Claude step on purpose:
      # that step can run for up to 30 minutes, and a token minted before it would have burned a
      # third of its life before the push.
      - name: Mint a GitHub App installation token
        id: app-token
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open a PR if the pass changed anything
        if: steps.gate.outputs.proceed == 'true'
        env:
          # A GitHub App installation token, deliberately not GITHUB_TOKEN. GitHub does not fire
          # `pull_request` events for a PR opened with GITHUB_TOKEN (recursion guard), so such a PR
          # gets NO ci.yml run and NO claude-code-review.yml run — it would sit there looking
          # reviewable while nothing had reviewed it. ADR-0015 says this pass opens a PR "never
          # merging unreviewed"; honouring that means a non-Actions identity opens it (ADR-0018).
          #
          # It is an App rather than the PAT ADR-0018 shipped because a PAT acts as the person who
          # owns it: the PR was authored by Muddl, and GitHub forbids a PR author from approving
          # their own PR — so the one human who could satisfy R2's approval requirement was
          # structurally barred from satisfying it. See ADR-0020.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice title=Housekeeping::No changes to propose."
            exit 0
          fi

          # Fail loudly rather than falling back to GITHUB_TOKEN: a silent fallback would still open
          # a PR, but one that CI and the reviewer never see — the exact failure this design exists
          # to prevent, and invisible precisely because the PR looks normal.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Housekeeping::No GitHub App installation token was minted. Refusing to open a PR with GITHUB_TOKEN, which would skip CI and Claude Code Review. Check vars.APP_CLIENT_ID and secrets.APP_PRIVATE_KEY for the MuddlBot App (ADR-0020)."
            exit 1
          fi

          # The identity is asserted, not assumed. claude-code-review.yml's `allowed_bots` pins the
          # literal slug, and that action refuses bot-triggered runs it does not recognise by
          # FAILING THE JOB RED AND ALERTING THE MAINTAINER (verified 2026-08-01, run 30725572647) —
          # not by declining quietly. This guard exists to fail earlier, at the pass itself, with a
          # message that names the exact cause, rather than waiting for that downstream red run.
          if [ "$APP_SLUG" != "muddlbot" ]; then
            echo "::error title=Housekeeping::App slug is '$APP_SLUG', expected 'muddlbot'. claude-code-review.yml's allowed_bots pins this slug; update BOTH, or every machine PR's review job fails red with 'Workflow initiated by non-human actor' and its alert step @-mentions the maintainer. See ADR-0020."
            exit 1
          fi

          STAMP="$(date -u +%Y-W%V)"
          # Keyed to the ISO week only. A second run in the same week — workflow_dispatch bypasses
          # the commit gate and always proceeds — collides with the existing branch and fails at
          # `git push` or `gh pr create`. Deliberately left to fail loudly rather than silently
          # opening a second PR for the same week; see gotchas.md.
          BRANCH="chore/housekeeping-$STAMP"

          # Commit author and PR author are now the same identity — the App's bot user — so `git
          # log` and the PR's "opened by" agree instead of disagreeing on purpose (ADR-0020).
          # The numeric prefix is that bot user's id: `gh api 'users/muddlbot%5Bbot%5D' --jq .id`.
          # GitHub only links a noreply address to an account when the id matches, so a wrong
          # number yields commits attributed to no one. Event delivery still keys off the
          # credential, not the trailer.
          git config user.name  "muddlbot[bot]"
          git config user.email "311914422+muddlbot[bot]@users.noreply.github.com"

          # claude-code-action takes ownership of this repo's git credentials during its step: it
          # deletes the `http.https://github.com/.extraheader` credential actions/checkout persisted,
          # repoints `origin` at a URL embedding its own OIDC-derived GitHub App installation token,
          # and then revokes that token (DELETE /installation/token) as the step ends. So by the time
          # this step runs, `origin` carries a dead credential and checkout's fallback is gone —
          # every push here died with "Invalid username or token" (exit 128). Setting GH_TOKEN does
          # not help on its own: it authenticates `gh`, never `git`.
          #
          # Restore a clean origin, then pass the App installation token as a one-shot header on
          # the push itself. An
          # embedded `https://x-access-token:$TOKEN@...` remote would work too, but persists the
          # token in .git/config for the rest of the job; `actions/checkout` avoids exactly that by
          # using an extraheader, and this step — which exists to route around a credential footgun
          # — should hold the same bar. The URL must be credential-free or its dead inline token
          # would still be preferred over the header.
          #
          # The host comes from GITHUB_SERVER_URL rather than a literal github.com, and the
          # extraheader config key below is derived from that same value, so the host and the
          # config key cannot drift apart.
          git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          # GitHub's automatic log redaction matches the LITERAL registered secret, not transforms
          # of it, so the base64 of "x-access-token:$GH_TOKEN" is NOT masked by default. Mask the
          # blob itself — a line containing only the base64, with no "AUTHORIZATION: basic "
          # prefix, would not be caught by a mask registered on the full header string. Nothing
          # here prints either today, but ACTIONS_STEP_DEBUG tracing would show them in the clear.
          # Defence in depth on a step whose credential handling has already broken twice. (#71)
          AUTH_B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_B64"
          AUTH_HEADER="AUTHORIZATION: basic $AUTH_B64"
          echo "::add-mask::$AUTH_HEADER"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: weekly housekeeping ($STAMP)" -m "Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git -c http."${GITHUB_SERVER_URL}/".extraheader="$AUTH_HEADER" push -u origin "$BRANCH"
          gh pr create \
            --title "chore: weekly housekeeping ($STAMP)" \
            --body "Automated housekeeping pass (docs / KB / roadmap / skills / agents). Review the diff before merging." \
            --base master --head "$BRANCH"

      # This is the only unattended cron in the factory: it fires at 09:00 UTC Monday with
      # nobody watching. There is no issue or PR context here, so the alert goes to the
      # long-lived tracking issue in vars.FACTORY_ALERT_ISSUE. If that variable is unset the
      # step fails loudly rather than swallowing the alert — a silent alerter is worse than none.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_ISSUE: ${{ vars.FACTORY_ALERT_ISSUE }}
        run: |
          if [ -z "$ALERT_ISSUE" ]; then
            echo "::error title=Alerting::FACTORY_ALERT_ISSUE is unset; the failure alert had nowhere to go."
            exit 1
          fi
          gh issue comment "$ALERT_ISSUE" --body \
            "@Muddl \`Weekly Housekeeping\` failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
